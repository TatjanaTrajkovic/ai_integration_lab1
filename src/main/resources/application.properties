spring.application.name=AI_integration_Tatjana

# -----------------------------------------------------------------------
# OpenRouter API-konfiguration
# API-nyckeln läses ALDRIG direkt här — den hämtas från en miljövariabel.
# Sätt miljövariabeln innan du startar appen:
#   export OPENROUTER_API_KEY=din-nyckel-här   (Mac/Linux)
#   set OPENROUTER_API_KEY=din-nyckel-här      (Windows)
# -----------------------------------------------------------------------
openrouter.api.key=${OPENROUTER_API_KEY}

# Vilken AI-modell som ska användas.
# openai/gpt-4o-mini är billig och snabb — bra för utveckling.
# Du kan byta till t.ex. "anthropic/claude-3-haiku" eller "meta-llama/llama-3.1-8b-instruct:free"
openrouter.model=openai/gpt-4o-mini
