spring.application.name=AI_integration_Tatjana

# === OpenRouter API-konfiguration ===

# API-nyckeln lasas fran en miljovariabel - hardkoda den ALDRIG direkt har.
# Satt miljovariabeln innan du startar appen:
#   Mac/Linux:  export OPENROUTER_API_KEY=din-nyckel-har
#   Windows:    set OPENROUTER_API_KEY=din-nyckel-har
openrouter.api.key=${OPENROUTER_API_KEY}

# Grundadressen till OpenRouter (bara hosten - sokvägen sätts i LlmClient).
# I tester overrides den har till http://localhost:PORT (WireMock-servern).
# AppConfig laser den via @Value("${openrouter.base-url:https://openrouter.ai}")
openrouter.base-url=https://openrouter.ai

# Vilken AI-modell som ska anvandas.
# Exempel pa andra modeller:
#   anthropic/claude-3-haiku
#   meta-llama/llama-3.1-8b-instruct:free  (gratis)
openrouter.model=openai/gpt-4o-mini